# Render blueprint. In the Render dashboard: New -> Blueprint -> pick this repo.
#
# A persistent web service rather than serverless functions, chosen because this
# app's requests are long: resume upload makes two Opus 5 calls back to back, and
# the end-of-interview assessment runs at high effort over a full transcript.
# Serverless per-request timeouts are the wrong shape for that.
services:
  - type: web
    name: hirescope
    runtime: node
    plan: free # free instances sleep when idle; first hit after a nap is slow

    # --include=dev is load-bearing. prisma, tsx, typescript, and tailwind are
    # all devDependencies and all are needed at BUILD time, so a host that sets
    # NODE_ENV=production would otherwise skip them and fail the build.
    buildCommand: >-
      npm install --include=dev &&
      npm run build &&
      npx prisma db push --accept-data-loss &&
      npm run db:seed:optional

    # Started from the repo root, which matters: the criteria/*.md files that
    # define the assessment standard are read from disk at request time rather
    # than bundled, so an operator can edit one on a running deployment and have
    # the next interview pick it up. A host that ships only the traced build
    # output would break that.
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard; never commit this
      - key: DATABASE_URL
        sync: false # Postgres connection string
      - key: MANAGER_PASSCODE
        sync: false
      - key: INVITE_CODES
        sync: false # comma-separated; omit to leave the demo ungated
      - key: MAX_INTERVIEWS_PER_DAY
        value: "15"
      # Seeds six invented candidates so manager search has something to return
      # on a fresh database. Idempotent (upserts), so it is safe on redeploy.
      # Set to "false" once real candidates exist.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: NODE_VERSION
        value: "22"
