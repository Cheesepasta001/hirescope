# Render blueprint. In the Render dashboard: New -> Blueprint -> pick this repo.
#
# A persistent web service rather than serverless functions, chosen because this
# app's requests are long: resume upload makes two Opus 5 calls back to back, and
# the end-of-interview assessment runs at high effort over a full transcript.
# Serverless per-request timeouts are the wrong shape for that.
services:
  - type: web
    name: hirescope
    runtime: node
    plan: free # free instances sleep when idle; first hit after a nap is slow
    buildCommand: npm install && npm run build && npx prisma db push --accept-data-loss
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard; never commit this
      - key: DATABASE_URL
        sync: false # Postgres connection string
      - key: MANAGER_PASSCODE
        sync: false
      - key: INVITE_CODES
        sync: false # comma-separated; omit to leave the demo ungated
      - key: MAX_INTERVIEWS_PER_DAY
        value: "15"
      - key: NODE_VERSION
        value: "22"
